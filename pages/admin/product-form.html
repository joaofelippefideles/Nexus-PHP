<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Produto — Nexus Tech</title>
  <meta name="description" content="Criar ou editar produto do catálogo Nexus Tech.">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2306b6d4'>N</text></svg>">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body data-page="admin-products">

  <div class="admin-shell">

    <header class="admin-topbar">
      <a href="index.html" class="admin-topbar__brand" aria-label="Nexus Tech — Painel">
        NEXUS<span class="admin-topbar__brand-accent">TECH</span>
        <span class="admin-topbar__brand-accent"> Admin</span>
      </a>

      <nav class="admin-nav" aria-label="Navegação do painel">
        <a href="index.html" class="admin-nav__link">Dashboard</a>
        <a href="products.html" class="admin-nav__link is-active" aria-current="page">Produtos</a>
        <a href="brands.html" class="admin-nav__link">Marcas</a>
        <a href="categories.html" class="admin-nav__link">Categorias</a>
      </nav>

      <div class="admin-topbar__session">
        <span class="admin-topbar__who">
          <span class="admin-topbar__name" id="admin-topbar-name"></span>
          <span class="admin-topbar__email" id="admin-topbar-email"></span>
        </span>
        <button type="button" class="admin-topbar__logout" id="admin-logout">Sair</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-pagehead">
        <div>
          <a href="products.html" class="admin-back">&larr; Voltar para produtos</a>
          <h1 class="admin-main__title" id="form-title">Novo produto</h1>
        </div>
      </div>

      <div class="admin-alert" id="product-alert" hidden role="alert"></div>

      <section class="admin-card">
        <form id="product-form" novalidate>

          <div class="admin-form__grid">
            <div class="admin-form__field admin-form__field--wide">
              <label class="admin-form__label" for="field-name">Nome *</label>
              <input type="text" id="field-name" class="admin-input" maxlength="200" autocomplete="off">
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-slug">Slug</label>
              <input type="text" id="field-slug" class="admin-input" maxlength="140" autocomplete="off">
              <p class="admin-form__hint" id="slug-hint">
                Se vazio, será gerado automaticamente a partir do nome.
              </p>
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-brand">Marca *</label>
              <select id="field-brand" class="admin-input">
                <option value="">Selecione...</option>
              </select>
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-category">Categoria *</label>
              <select id="field-category" class="admin-input">
                <option value="">Selecione...</option>
              </select>
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-price">Preço (R$) *</label>
              <input type="number" id="field-price" class="admin-input" min="0" step="0.01" inputmode="decimal">
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-old-price">Preço anterior (R$)</label>
              <input type="number" id="field-old-price" class="admin-input" min="0" step="0.01" inputmode="decimal">
            </div>

            <div class="admin-form__field">
              <label class="admin-form__label" for="field-stock">Estoque (unidades)</label>
              <input type="number" id="field-stock" class="admin-input" min="0" step="1" inputmode="numeric">
            </div>

            <div class="admin-form__field admin-form__field--wide">
              <label class="admin-form__label" for="field-description">Descrição</label>
              <textarea id="field-description" class="admin-input admin-input--textarea" maxlength="5000" rows="4"></textarea>
            </div>
          </div>

          <fieldset class="admin-checks">
            <legend class="admin-form__label">Exibição</legend>
            <label class="admin-check">
              <input type="checkbox" id="field-active" checked>
              <span>Produto ativo</span>
            </label>
            <label class="admin-check">
              <input type="checkbox" id="field-featured">
              <span>Em destaque</span>
            </label>
            <label class="admin-check">
              <input type="checkbox" id="field-new">
              <span>Novo</span>
            </label>
            <label class="admin-check">
              <input type="checkbox" id="field-bestseller">
              <span>Mais vendido</span>
            </label>
          </fieldset>

          <div class="admin-repeater">
            <div class="admin-repeater__head">
              <h2 class="admin-repeater__title">Especificações</h2>
              <button type="button" id="specs-add" class="admin-btn admin-btn--secondary admin-btn--small">
                Adicionar especificação
              </button>
            </div>
            <div class="admin-repeater__rows" id="specs-container"></div>
          </div>

          <div class="admin-repeater">
            <div class="admin-repeater__head">
              <h2 class="admin-repeater__title">Imagens</h2>
              <button type="button" id="images-add" class="admin-btn admin-btn--secondary admin-btn--small">
                Adicionar imagem
              </button>
            </div>
            <div class="admin-repeater__rows" id="images-container"></div>
          </div>

          <div class="admin-form__actions">
            <button type="button" id="form-cancel" class="admin-btn admin-btn--ghost">Cancelar</button>
            <button type="submit" id="form-submit" class="admin-btn admin-btn--primary">
              Salvar produto
            </button>
          </div>

        </form>
      </section>
    </main>

  </div>

  <script type="module" src="../../assets/js/modules/admin/shell.js"></script>
  <script type="module" src="../../assets/js/modules/admin/product-form.js"></script>
</body>
</html>
